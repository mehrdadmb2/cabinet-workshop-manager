<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Cabinet Workshop OS — مدیریت پروژه، Workbook، نقشه‌کشی فنی، قطعات، خروجی و پشتیبان‌گیری." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/app.css" />
  <title>Cabinet Workshop OS</title>
</head>
<body>
  <div id="app"></div>

  <input id="fileExcel" type="file" accept=".xlsx,.xlsm,.xltx,.xltm,.xls" hidden />
  <input id="fileProject" type="file" accept=".kwm,.json" hidden />
  <input id="fileImage" type="file" accept="image/*" hidden />

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot"></div>

  <!-- Pinned browser libraries. The service worker caches them after the first successful load. -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
